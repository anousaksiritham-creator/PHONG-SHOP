<!doctype html>
<html lang="lo">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
<title>PHAVORA</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#0b0b0c">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&family=Noto+Sans+Lao:wght@400;500;600;700&family=Syncopate&display=swap">
<style>
/* Layout: phone-first column of full-bleed black bands; product grid 2 → 3 → 4 columns;
   sticky header + sticky category chips; fixed buy bar on product pages. Single dark look. */
:root{
  --ink:#0b0b0c; --panel:#151517; --panel-2:#1e1e22; --line:#2c2c31;
  --paper:#f3f3f0; --mute:#9b9ca3; --card:#e9e8e4; --card-ink:#111113;
  --chrome-hi:#f7f8fa; --chrome-lo:#aeb2b9; --chrome:#cfd2d7;
  --low:#f0c24b; --bad:#ff6a5f; --ok:#7bd8a2;
  --f-display:"Anton","Impact","Arial Narrow Bold",sans-serif;
  --f-body:"Inter","Noto Sans Lao","Leelawadee UI","Phetsarath OT",system-ui,sans-serif;
  --f-brand:"Syncopate","Inter",sans-serif;
  --gut-l:max(16px, env(safe-area-inset-left, 0px));
  --gut-r:max(16px, env(safe-area-inset-right, 0px));
  --head:56px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--ink);color:var(--paper);font-family:var(--f-body);font-size:15px;line-height:1.6;min-height:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--ink)}
a{color:inherit}
button{font:inherit;color:inherit}
img{max-width:100%}
:focus-visible{outline:2px solid var(--chrome);outline-offset:2px}
.wrap{padding-left:var(--gut-l);padding-right:var(--gut-r);max-width:1120px;margin-inline:auto}

/* demo strip + header */
.demo{background:var(--panel);border-bottom:1px solid var(--line);font-size:12px;color:var(--mute)}
.demo .wrap{display:flex;gap:10px;align-items:center;justify-content:space-between;padding-block:6px;flex-wrap:wrap}
.demo .sw2{display:flex;gap:6px}
.demo a,.demo button{color:var(--paper);text-decoration:none;border:1px solid var(--line);padding:2px 10px;border-radius:99px;background:none;cursor:pointer;font-size:12px;line-height:1.6}
.demo a[aria-current="true"]{background:var(--paper);color:var(--ink);border-color:var(--paper)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(11,11,12,.93);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .wrap{height:var(--head);display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-family:var(--f-brand);font-size:14px;letter-spacing:.2em;text-decoration:none;white-space:nowrap}
.brand small{font-family:var(--f-body);font-size:10px;letter-spacing:.14em;font-weight:700;margin-left:8px;padding:2px 6px;border:1px solid var(--line);border-radius:2px;color:var(--mute);vertical-align:middle}
.top nav{display:flex;gap:4px;align-items:center}
.navlink{font-size:13px;text-decoration:none;padding:8px 10px;color:var(--mute);white-space:nowrap}
.navlink:hover{color:var(--paper)}
.cartbtn{display:inline-flex;align-items:center;gap:8px;text-decoration:none;font-size:13px;font-weight:600;border:1px solid var(--line);border-radius:99px;padding:5px 6px 5px 14px}
.cartbtn .count{min-width:24px;height:24px;padding:0 6px;border-radius:99px;background:var(--paper);color:var(--ink);font-size:12px;display:grid;place-items:center;font-variant-numeric:tabular-nums}
.cartbtn .count.zero{background:var(--panel-2);color:var(--mute)}

/* hero: tilted photo reels scrolling behind, liquid-chrome drop number, spinning badge, ticker below */
.hero{position:relative;overflow:hidden;isolation:isolate}
.hero-bg{position:absolute;inset:-22% -14%;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;transform:rotate(-9deg);z-index:-2;opacity:.62}
.hero-bg .col{overflow:hidden;min-width:0}
.hero-bg .col:nth-child(n+4){display:none}
@media(min-width:720px){.hero-bg{grid-template-columns:repeat(5,minmax(0,1fr));inset:-34% -6%}.hero-bg .col:nth-child(n+4){display:block}}
.reel{display:flex;flex-direction:column;animation:reel-up 42s linear infinite;will-change:transform}
.hero-bg .col:nth-child(even) .reel{animation-name:reel-down;animation-duration:50s}
.hero-bg .col:nth-child(3) .reel{animation-duration:58s}
.reel>div{display:grid;gap:8px;padding-bottom:8px}
.reel img{width:100%;aspect-ratio:3/4;object-fit:cover;display:block;border-radius:3px;filter:grayscale(.45) contrast(1.08);background:var(--panel)}
@keyframes reel-up{from{transform:translateY(0)}to{transform:translateY(-50%)}}
@keyframes reel-down{from{transform:translateY(-50%)}to{transform:translateY(0)}}
.hero-shade{position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(11,11,12,.2) 0%,rgba(11,11,12,.42) 34%,rgba(11,11,12,.9) 66%,var(--ink) 100%)}
.hero-in{position:relative;padding-block:clamp(180px,50vw,320px) 26px;display:grid;gap:14px}
.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);margin:0}
.hero .eyebrow{color:var(--chrome)}
.drop{font-family:var(--f-display);font-weight:400;font-size:clamp(88px,27vw,220px);line-height:.84;margin:0;text-transform:uppercase;display:flex;align-items:flex-end;gap:.05em}
.numwrap{position:relative;display:inline-block}
.num{background:linear-gradient(100deg,#6f737a 0%,#ffffff 14%,#a3a7ae 28%,#f4f5f7 42%,#7b7f86 56%,#ffffff 70%,#989ca3 84%,#6f737a 100%);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:chrome 5s linear infinite}
@keyframes chrome{from{background-position:0 0}to{background-position:-200% 0}}
.star{position:absolute;top:-.14em;right:-.3em;width:.34em;height:.34em;animation:spin 9s linear infinite,glow 2.4s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes glow{50%{filter:drop-shadow(0 0 9px rgba(255,255,255,.8))}}
.ring{position:absolute;top:16px;right:var(--gut-r);width:clamp(96px,27vw,136px);height:auto;z-index:1;animation:spin 18s linear infinite}
.ring text{font-family:var(--f-body);font-size:9.6px;font-weight:700;letter-spacing:.06em;fill:var(--paper)}
.lede{margin:0;color:#c4c5ca;max-width:44ch}
.ticker{overflow:hidden;white-space:nowrap;background:linear-gradient(180deg,var(--chrome-hi),var(--chrome-lo));color:var(--card-ink);border-block:1px solid #000}
.ticker .tk{display:inline-flex;animation:tick 26s linear infinite;will-change:transform}
.ticker span{font-family:var(--f-display);font-size:19px;line-height:1;padding:10px 14px 10px 0;text-transform:uppercase;letter-spacing:.02em;display:inline-flex;align-items:center;gap:14px}
.ticker span::after{content:"";width:12px;height:12px;background:currentColor;clip-path:polygon(50% 0,61% 39%,100% 50%,61% 61%,50% 100%,39% 61%,0 50%,39% 39%)}
.ticker.alt{background:var(--ink);color:transparent;border-color:var(--line)}
.ticker.alt span{-webkit-text-stroke:1px var(--chrome);font-size:28px;padding-block:12px}
.ticker.alt span::after{background:var(--chrome)}
.ticker.alt .tk{animation-direction:reverse;animation-duration:34s}
@keyframes tick{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.hero.off *,.hero.off{animation-play-state:paused!important}
.grain{position:fixed;inset:-50%;z-index:110;pointer-events:none;opacity:.06;background-size:160px 160px;animation:grain 1.1s steps(6) infinite}
.is-admin .grain{display:none}
@keyframes grain{0%,100%{transform:translate(0,0)}20%{transform:translate(-4%,3%)}40%{transform:translate(3%,-5%)}60%{transform:translate(-6%,-2%)}80%{transform:translate(5%,4%)}}

/* buttons, chips */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 22px;border-radius:999px;border:1px solid var(--line);background:transparent;font-weight:700;font-size:15px;letter-spacing:.02em;text-decoration:none;cursor:pointer;text-align:center}
.btn.chrome{background:linear-gradient(180deg,var(--chrome-hi),var(--chrome-lo));color:var(--card-ink);border-color:transparent;box-shadow:inset 0 1px 0 #fff,0 1px 0 rgba(0,0,0,.5)}
.btn.shine{position:relative;overflow:hidden;isolation:isolate}
.btn.shine::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 35%,rgba(255,255,255,.9) 50%,transparent 65%);transform:translateX(-120%);animation:shine 3.4s ease-in-out infinite;pointer-events:none}
@keyframes shine{55%,100%{transform:translateX(120%)}}
.btn.block{width:100%}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn.ghost{color:var(--mute)}
.btn.danger{border-color:#5d2b28;color:var(--bad)}
.btn.sm{min-height:40px;padding:0 16px;font-size:14px}
.chips{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--head));z-index:15;background:var(--ink);border-bottom:1px solid var(--line)}
.chips .wrap{display:flex;gap:8px;overflow-x:auto;padding-block:10px;scrollbar-width:none}
.chips .wrap::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:99px;padding:6px 14px;font-size:13px;font-weight:600;letter-spacing:.06em;background:transparent;cursor:pointer;color:var(--mute);text-decoration:none}
.chip[aria-pressed="true"],.chip[aria-current="page"]{background:var(--paper);color:var(--ink);border-color:var(--paper)}
.chip .n{opacity:.65;font-variant-numeric:tabular-nums}

/* product grid */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px 10px;padding-block:16px 34px}
@media(min-width:720px){.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:26px 16px}}
@media(min-width:1024px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.card{display:grid;gap:8px;align-content:start;text-decoration:none;min-width:0}
.ph{position:relative;aspect-ratio:4/5;background:var(--card);border-radius:4px;overflow:hidden;max-width:100%}
.ph img{width:100%;height:100%;object-fit:cover;mix-blend-mode:multiply;display:block}
.card.sold .ph img{opacity:.35;filter:grayscale(1)}
.badges{position:absolute;left:8px;top:8px;display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.badge{font-size:10.5px;font-weight:700;letter-spacing:.08em;padding:3px 7px;border-radius:2px;line-height:1.35}
.badge.sold{background:var(--card-ink);color:var(--paper)}
.badge.last{background:linear-gradient(180deg,var(--chrome-hi),var(--chrome-lo));color:var(--card-ink)}
.badge.low{background:var(--low);color:#1a1405;letter-spacing:0;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.5}}
@media(hover:hover){.card .ph img{transition:transform .5s ease}.card:hover .ph img{transform:scale(1.05)}}
.card h3{font-size:13.5px;font-weight:600;margin:0;line-height:1.35}
.card .price{font-size:13.5px;margin:0;color:var(--mute);font-variant-numeric:tabular-nums}
.dots-sw{display:flex;gap:5px}
.dots-sw i{width:11px;height:11px;border-radius:50%;border:1px solid #55555c}

/* sections */
.sec-h{font-family:var(--f-display);font-weight:400;text-transform:uppercase;font-size:30px;line-height:1;margin:0}
.how{border-top:1px solid var(--line)}
.how .wrap{padding-block:32px;display:grid;gap:16px}
.how ol{list-style:none;margin:0;padding:0;display:grid;gap:10px;counter-reset:s}
@media(min-width:720px){.how ol{grid-template-columns:repeat(3,minmax(0,1fr))}}
.how li{counter-increment:s;display:grid;grid-template-columns:46px minmax(0,1fr);gap:12px;align-items:start;background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:14px}
.how li::before{content:counter(s,decimal-leading-zero);font-family:var(--f-display);font-size:32px;line-height:1;color:transparent;-webkit-text-stroke:1px var(--chrome)}
.how b{display:block}
.how p{margin:2px 0 0;color:var(--mute);font-size:13.5px}
.foot{border-top:1px solid var(--line);color:var(--mute);font-size:13px}
.foot .wrap{padding-block:28px 44px;display:grid;gap:18px}
.foot .big{font-family:var(--f-brand);letter-spacing:.34em;color:var(--paper);font-size:18px}
.foot nav{display:flex;flex-wrap:wrap;gap:8px 18px}
.foot a,.foot button{text-decoration:none;background:none;border:0;padding:0;cursor:pointer;color:var(--mute);font-size:13px}
.foot a:hover,.foot button:hover{color:var(--paper)}

/* product page */
.gal{position:relative;background:var(--card);max-width:100%;overflow:hidden}
.gal .track{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.gal .track::-webkit-scrollbar{display:none}
.gal .slide{flex:0 0 100%;scroll-snap-align:start;aspect-ratio:4/5;max-width:100%}
.gal img{width:100%;height:100%;object-fit:cover;display:block}
.gal img.cut{mix-blend-mode:multiply}
.gal .dots{position:absolute;bottom:12px;left:0;right:0;display:flex;justify-content:center;gap:6px;pointer-events:none}
.gal .dots i{width:6px;height:6px;border-radius:3px;background:rgba(0,0,0,.28);transition:width .2s}
.gal .dots i.on{background:var(--card-ink);width:18px}
.gal.sold img{filter:grayscale(1);opacity:.45}
.back{position:absolute;top:12px;left:max(12px,env(safe-area-inset-left,0px));width:42px;height:42px;border-radius:50%;background:rgba(11,11,12,.78);color:var(--paper);display:grid;place-items:center;text-decoration:none;font-size:19px}
.info{display:grid;gap:18px;padding-block:20px 120px;padding-left:var(--gut-l);padding-right:var(--gut-r);min-width:0}
.bline{display:flex;gap:6px;flex-wrap:wrap}
.pname{font-family:var(--f-display);font-weight:400;font-size:36px;line-height:1.02;text-transform:uppercase;margin:0;text-wrap:balance}
.plao{margin:-8px 0 0;color:var(--mute)}
.pprice{font-size:21px;font-weight:700;margin:0;font-variant-numeric:tabular-nums}
.opt{display:grid;gap:10px}
.lbl{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.lbl b{color:var(--paper);letter-spacing:0;text-transform:none;margin-left:6px;font-weight:600}
.sws{display:flex;gap:10px}
.sw{width:42px;height:42px;border-radius:50%;border:2px solid var(--line);padding:3px;background:transparent;cursor:pointer}
.sw i{display:block;width:100%;height:100%;border-radius:50%;border:1px solid #444}
.sw[aria-pressed="true"]{border-color:var(--paper)}
.sizes{display:grid;grid-template-columns:repeat(auto-fill,minmax(86px,1fr));gap:8px}
.size{display:grid;justify-items:center;padding:9px 6px;border:1px solid var(--line);border-radius:4px;background:var(--panel);cursor:pointer;line-height:1.3}
.size b{font-size:16px}
.size small{font-size:11.5px;color:var(--mute)}
.size.low small{color:var(--low)}
.size[aria-pressed="true"]{border-color:var(--paper);background:var(--paper);color:var(--ink)}
.size[aria-pressed="true"] small{color:#555}
.size:disabled{opacity:.35;cursor:not-allowed}
.size:disabled b{text-decoration:line-through}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
details{border-top:1px solid var(--line);padding-block:13px}
details:last-of-type{border-bottom:1px solid var(--line)}
summary{cursor:pointer;font-weight:600;list-style:none;display:flex;justify-content:space-between;gap:12px}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";color:var(--mute);font-weight:400}
details[open] summary::after{content:"−"}
details p,details ul{color:var(--mute);margin:10px 0 0;font-size:14px}
details ul{padding-left:18px}
.tablewrap{overflow-x:auto}
table.chart{width:100%;border-collapse:collapse;margin-top:10px;font-size:14px;font-variant-numeric:tabular-nums}
.chart th,.chart td{padding:8px;border-bottom:1px solid var(--line);text-align:left}
.chart th{color:var(--mute);font-weight:500;font-size:12px}
.hscroll{display:grid;grid-auto-flow:column;grid-auto-columns:42%;gap:10px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px}
.hscroll::-webkit-scrollbar{display:none}
@media(min-width:720px){.hscroll{grid-auto-columns:30%}}
.buybar{position:fixed;left:0;right:0;bottom:0;z-index:25;background:rgba(11,11,12,.95);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:10px var(--gut-r) calc(10px + env(safe-area-inset-bottom,0px)) var(--gut-l)}
.buybar .in{max-width:560px;margin-inline:auto;display:grid;gap:6px}
.buybar .note{text-align:center;margin:0}
@media(min-width:900px){
  .pdp{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:40px;max-width:1120px;margin-inline:auto;padding:24px var(--gut-r) 0 var(--gut-l)}
  .pdp .gal{border-radius:4px;align-self:start;position:sticky;top:calc(var(--head) + 16px)}
  .pdp .info{padding:0 0 120px}
}

/* generic pages */
.page{padding-block:22px 48px;display:grid;gap:18px;max-width:640px}
.page.wide{max-width:none}
.page-h{font-family:var(--f-display);font-weight:400;font-size:38px;text-transform:uppercase;margin:0;line-height:1}
.muted{color:var(--mute)}
.note{font-size:13px;color:var(--mute)}
.line{display:grid;grid-template-columns:78px minmax(0,1fr);gap:12px;padding-block:12px;border-bottom:1px solid var(--line)}
.line h3{font-size:14px;margin:0;line-height:1.35}
.line .sub{font-size:13px;color:var(--mute);margin:2px 0 0}
.line .row{display:flex;justify-content:space-between;align-items:center;margin-top:8px;gap:8px;flex-wrap:wrap}
.line .warn{color:var(--low);font-size:12.5px;margin:6px 0 0}
.step{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:99px}
.step button{width:36px;height:34px;background:none;border:0;cursor:pointer;font-size:17px}
.step button:disabled{opacity:.3;cursor:not-allowed}
.step span{min-width:22px;text-align:center;font-variant-numeric:tabular-nums}
.link{background:none;border:0;color:var(--mute);text-decoration:underline;cursor:pointer;font-size:13px;padding:0}
.sum{display:grid;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:16px}
.sum .r{display:flex;justify-content:space-between;gap:12px;font-variant-numeric:tabular-nums}
.sum .r.total{font-size:18px;font-weight:700;border-top:1px solid var(--line);padding-top:10px}
.sum .r .mini{font-size:13px;color:var(--mute)}
.empty{padding:44px 0;text-align:center;color:var(--mute);display:grid;gap:16px;justify-items:center}
form{display:grid;gap:16px}
.field{display:grid;gap:6px;min-width:0}
.field>label,.field .flbl{font-size:13px;font-weight:600}
.field input,.field select,.field textarea{width:100%;min-height:48px;background:var(--panel);border:1px solid var(--line);border-radius:4px;color:var(--paper);padding:10px 12px;font:inherit;font-size:16px}
.field textarea{min-height:76px;resize:vertical}
.field .hint{font-size:12px;color:var(--mute)}
.field.err input,.field.err select,.field.err .radios{border-color:var(--bad)}
.field .msg{font-size:12px;color:var(--bad)}
.row2{display:grid;gap:16px}
@media(min-width:560px){.row2{grid-template-columns:1fr 1fr}}
.radios{display:flex;flex-wrap:wrap;gap:8px;border:1px solid transparent;border-radius:6px}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.check input{width:20px;height:20px;margin-top:2px;accent-color:var(--paper);flex:none}
.err-text{color:var(--bad);font-size:13px;margin:0}

/* pay */
.timer{display:flex;justify-content:space-between;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:10px 16px}
.timer b{font-family:var(--f-display);font-size:30px;font-weight:400;font-variant-numeric:tabular-nums;letter-spacing:.04em}
.timer.hurry b{color:var(--low)}
.amount{font-family:var(--f-display);font-weight:400;font-size:54px;line-height:1;margin:0;font-variant-numeric:tabular-nums}
.qrbox{background:#fff;border-radius:6px;padding:16px;display:grid;justify-items:center;gap:8px;color:#444;max-width:280px;width:100%;margin-inline:auto}
.qrbox svg,.qrbox img{width:100%;max-width:220px;height:auto;display:block}
.qrbox small{font-size:11.5px;text-align:center;line-height:1.4}
.qrbox.card{padding:0;overflow:hidden;max-width:340px}
.qrbox.card img{max-width:none;-webkit-touch-callout:default}
.qrsave{display:grid;gap:6px;justify-items:center;max-width:340px;width:100%;margin-inline:auto}
.qrsave .note{text-align:center;margin:0;font-size:12px;line-height:1.5}
dl.kv{margin:0;border:1px solid var(--line);border-radius:4px}

function load() {
  try { const raw = localStorage.getItem(KEY); if (raw) { const s = JSON.parse(raw); if (s && s.v === 1) return s; } } catch (e) {}
  return seed();
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(S)); }
  catch (e) { toast('ບັນທຶກຂໍ້ມູນໃນເຄື່ອງບໍ່ໄດ້ (ພື້ນທີ່ເຕັມ)'); }
}
let S = load();

const P = id => S.products.find(p => p.id === id);
const colorOf = (p, k) => p && p.colors.find(c => c.key === k);
const colorTotal = c => Object.values(c.stock).reduce((a, b) => a + b, 0);
const totalStock = p => p.colors.reduce((a, c) => a + colorTotal(c), 0);
const isLast = p => p.drop !== S.current && totalStock(p) > 0;
const inShop = p => p.drop === S.current || totalStock(p) > 0;
const inArchive = p => p.drop !== S.current && totalStock(p) === 0;
const orderTotal = o => o.items.reduce((a, i) => a + i.price * i.qty, 0);
const cartCount = () => S.cart.reduce((a, l) => a + l.qty, 0);
const dropOf = id => S.drops.find(d => d.id === id) || { id, name: 'DROP ' + id, month: '' };
const pendingCount = () => S.orders.filter(o => o.status === 'pending_review').length;
const itemName = it => { const p = P(it.pid); const c = colorOf(p, it.color); return (p ? p.name : it.pid) + (p && p.colors.length > 1 && c ? ' · ' + c.label : '') + (it.size !== 'FREE' ? ' · ' + it.size : ''); };
function lowText(p) {
  const t = totalStock(p); if (t === 0) return '';
  return t <= 3 ? 'ເຫຼືອ ' + t + ' ໂຕ' : '';
}
function restock(o) { o.items.forEach(it => { const c = colorOf(P(it.pid), it.color); if (c) c.stock[it.size] = (c.stock[it.size] || 0) + it.qty; }); }
function reserve(items) {
  for (const it of items) { const c = colorOf(P(it.pid), it.color); if (!c || (c.stock[it.size] || 0) < it.qty) return it; }
  items.forEach(it => { colorOf(P(it.pid), it.color).stock[it.size] -= it.qty; });
  return null;
}
function sweep() {
  const now = Date.now(); let changed = false;
  S.orders.forEach(o => { if (o.status === 'awaiting_payment' && o.expiresAt < now) { o.status = 'expired'; restock(o); changed = true; } });
  if (changed) save();
}

function pseudoQRCells(seedStr) {

  const inF = (x, y) => (x < 8 && y < 8) || (x >= n - 8 && y < 8) || (x < 8 && y >= n - 8);
  const cells = [];
  for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) { if (!inF(x, y) && rnd() < 0.5) cells.push([x, y]); }

}
function drawPseudoQR(g, seedStr, x0, y0, size) {

  g.fillStyle = '#fff'; g.fillRect(x0, y0, size, size);
  cells.forEach(([x, y]) => R(x, y, 1, 1, '#111'));
  [[0, 0], [n - 7, 0], [0, n - 7]].forEach(([x, y]) => { R(x, y, 7, 7, '#111'); R(x + 1, y + 1, 5, 5, '#fff'); R(x + 2, y + 2, 3, 3, '#111'); });

function readImage(file, max, cb) {
  if (!file || !file.type.startsWith('image/')) { toast('ກະລຸນາເລືອກໄຟລ໌ຮູບ'); return; }
  const fr = new FileReader();
  fr.onload = () => {
    const im = new Image();
    im.onload = () => {
      const k = Math.min(1, max / Math.max(im.width, im.height));
      const c = document.createElement('canvas'); c.width = Math.round(im.width * k); c.height = Math.round(im.height * k);

    };
    im.onerror = () => toast('ເປີດຮູບນີ້ບໍ່ໄດ້');
    im.src = fr.result;
  };
  fr.readAsDataURL(file);
}

      <div class="field"><span class="flbl">QR ຮັບເງິນ</span><div class="acts">${qr ? `<img class="qrprev" src="${qr}" alt="QR ປັດຈຸບັນ">` : '<span class="note">ຍັງໃຊ້ QR ຕົວຢ່າງ</span>'}<label class="btn sm" for="qrfile" style="position:relative">ອັບຮູບ QR<input type="file" id="qrfile" accept="image/*" style="position:absolute;opacity:0;width:1px;height:1px"></label></div><span class="hint">ຖ່າຍໜ້າຈໍ QR ຮັບເງິນຈາກແອບທະນາຄານ ແລ້ວຕັດໃຫ້ເຫຼືອແຕ່ QR (ລູກຄ້າຈະບັນທຶກຮູບນີ້ໄປສະແກນ)</span></div>
      <button class="btn chrome sm" type="submit" style="justify-self:start">ບັນທຶກ</button></form>
    <div class="box"><h2>Telegram</h2><p class="muted" style="margin:0">ເຊື່ອມ bot ກັບ Telegram ຂອງຮ້ານໃນໄລຍະ 2 (ລະບົບແທ້). ຕົ້ນແບບນີ້ສະແດງຕົວຢ່າງຂໍ້ຄວາມໃນແຖບອໍເດີ.</p></div>
    <div class="box"><h2>ຂໍ້ມູນຕົ້ນແບບ</h2><p class="muted" style="margin:0">ອໍເດີ, stock ແລະ ກະຕ່າ ບັນທຶກໄວ້ໃນ browser ນີ້ເທົ່ານັ້ນ.</p>
      ${resetAsk ? `<div class="acts"><button type="button" class="btn sm danger" data-act="reset-go">ລ້າງ ແລະ ເລີ່ມໃໝ່</button><button type="button" class="btn sm ghost" data-act="reset-no">ບໍ່ລ້າງ</button></div>` : `<button type="button" class="btn sm" data-act="reset-ask" style="justify-self:start">ກັບໄປຂໍ້ມູນຕົວຢ່າງເລີ່ມຕົ້ນ</button>`}</div>`;
}

/* ---------- router ---------- */
let lastHash = null;
function parse() {
  const h = decodeURIComponent((location.hash || '').slice(1)) || 'shop';
  const i = h.indexOf('-');
  return i < 0 ? [h, ''] : [h.slice(0, i), h.slice(i + 1)];
}
function route() {
  sweep();
  const [v, a] = parse();
  if (v === 'pay') { const o = S.orders.find(x => x.code === a); if (o && o.status !== 'awaiting_payment') { location.replace('#track-' + a); return; } }
  if (v === 'checkout' && !S.cart.length) { location.replace('#cart'); return; }
  if (v !== 'admin') { rejecting = null; dropAsk = false; resetAsk = false; }
  render();
  if (location.hash !== lastHash) { window.scrollTo(0, 0); lastHash = location.hash; }
}
function render() {
  const [v, a] = parse();
  const views = { shop: vShop, product: () => vProduct(a), cart: vCart, checkout: vCheckout, pay: () => vPay(a), track: () => vTrack(a), archive: vArchive, policy: vPolicy, admin: () => vAdmin(a) };
  const g0 = $('#gal'), keepKey = g0 && g0.dataset.key, keepX = g0 ? g0.scrollLeft : 0;
  $('#app').innerHTML = (views[v] || vShop)() + (zoom ? `<div class="overlay" data-act="zoom-close" role="dialog" aria-label="ຮູບບິນ"><img src="${zoom}" alt="ຮູບບິນ"></div>` : '');
  const g1 = $('#gal'); if (g1 && keepKey && g1.dataset.key === keepKey && keepX) g1.scrollLeft = keepX;
  after(v);
}
function showSplash() {
  if ($('#splash')) return;
  const letters = [...'PHAVORA'].map((ch, i) => `<span style="--i:${i}">${ch}</span>`).join('');
  const dust = Array.from({ length: 18 }, () => { const s = (Math.random() * 2.2 + 1).toFixed(1); return `<i style="left:${(Math.random() * 100).toFixed(1)}%;width:${s}px;height:${s}px;--dx:${Math.round(Math.random() * 60 - 30)}px;animation-duration:${(Math.random() * 8 + 7).toFixed(1)}s;animation-delay:-${(Math.random() * 12).toFixed(1)}s"></i>`; }).join('');
  const el = document.createElement('div');
  el.id = 'splash'; el.className = 'splash';
  el.setAttribute('role', 'dialog'); el.setAttribute('aria-modal', 'true'); el.setAttribute('aria-label', 'PHAVORA');
  el.innerHTML = `<div class="sp-bg" style="background-image:url(${IMG}intro.jpg)"></div>
    <div class="sp-stage">
      <div class="sp-artwrap"><img class="sp-art" src="${IMG}intro.jpg" alt="Hoodie ສີດຳ · PHAVORA new collection 2026"></div>
      <div class="sp-glow"></div><div class="sp-sweep"></div>
      <div class="sp-smoke"><i></i><i></i><i></i></div>
      <div class="sp-dust">${dust}</div>
      <div class="sp-flash"></div>
      <div class="sp-top"><small>PHAVORA<br>NEW COLLECTION 2026</small><p class="sp-brand" aria-hidden="true">${letters}</p></div>
      <div></div>
      <div class="sp-bottom"><button type="button" class="btn sp-go shine" data-act="enter">GET STARTED <span class="arr" aria-hidden="true">→</span></button><small>WEAR YOUR ATTITUDE</small></div>
    </div>`;
  document.body.appendChild(el); document.body.classList.add('has-splash');
  setTimeout(() => { const b = el.querySelector('.sp-go'); if (b && !el.classList.contains('out')) b.focus({ preventScroll: true }); }, 2000);
}
function enterShop() {
  const el = $('#splash'); if (!el || el.classList.contains('out')) return;
  el.classList.add('out'); document.body.classList.remove('has-splash');
  setTimeout(() => el.remove(), 800);
}
let heroIO = null;
function after(v) {
  document.body.classList.toggle('is-admin', v === 'admin');
  if (heroIO) { heroIO.disconnect(); heroIO = null; }
  const hero = $('#hero');
  if (hero && 'IntersectionObserver' in window) { heroIO = new IntersectionObserver(([en]) => hero.classList.toggle('off', !en.isIntersecting)); heroIO.observe(hero); }
  if (v === 'product') {
    const tr = $('#gal'), dots = document.querySelectorAll('.gal .dots i');
    if (tr && dots.length) {
      const upd = () => { const i = Math.round(tr.scrollLeft / Math.max(1, tr.clientWidth)); dots.forEach((d, k) => d.classList.toggle('on', k === i)); };
      tr.addEventListener('scroll', upd, { passive: true }); upd();
    }
  }
  if (v === 'pay') { updateTimer(); paintQrCard(); }
}
function updateTimer() {
  const [v, a] = parse(); if (v !== 'pay') return;
  const o = S.orders.find(x => x.code === a); const el = $('#cd'); if (!o || !el) return;
  const left = o.expiresAt - Date.now();
  if (left <= 0) { route(); return; }
  const s = Math.ceil(left / 1000);
  el.textContent = String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
  $('#timer').classList.toggle('hurry', s <= 180);
}
let tickN = 0;
setInterval(() => {
  tickN++;
  updateTimer();
  if (tickN % 15 === 0) {
    sweep();
    const [v] = parse();
    const typing = document.activeElement && /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
    if ((v === 'track' || v === 'admin') && !typing && !zoom) render();
  }
}, 1000);
window.addEventListener('hashchange', route);
window.addEventListener('storage', e => { if (e.key === KEY) { S = load(); render(); } });

/* ---------- events ---------- */
async function copyText(t) {
  try { await navigator.clipboard.writeText(t); toast('ກັອບແລ້ວ: ' + t); }
  catch (e) { toast('ກັອບບໍ່ໄດ້ · ກົດຄ້າງທີ່ຕົວເລກເພື່ອກັອບເອງ'); }
}
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const act = el.dataset.act, code = el.dataset.code;
  const o = code ? S.orders.find(x => x.code === code) : null;
  switch (act) {
    case 'enter': enterShop(); break;
    case 'intro': showSplash(); break;
    case 'toGrid': $('#grid').scrollIntoView({ behavior: 'smooth' }); break;
    case 'filter': filter = el.dataset.v; render(); $('#grid').scrollIntoView(); break;
    case 'color': pdp.color = el.dataset.v; pdp.size = null; render(); break;
    case 'size': pdp.size = el.dataset.v; render(); break;
    case 'add': addToCart(); break;
    case 'notify': toast('ໃນເວັບແທ້ ປຸ່ມນີ້ເປີດ WhatsApp ຫາຮ້ານ ພ້ອມຊື່ສິນຄ້າ'); break;
    case 'social': toast('ໃສ່ລິ້ງ ' + el.textContent + ' ຂອງຮ້ານພາຍຫຼັງ'); break;
    case 'qty': { const l = S.cart[+el.dataset.i]; l.qty = Math.max(1, l.qty + +el.dataset.d); save(); render(); break; }
    case 'rm': S.cart.splice(+el.dataset.i, 1); save(); render(); break;
    case 'blocked': e.preventDefault(); toast('ແກ້ລາຍການທີ່ມີຄຳເຕືອນກ່ອນ'); break;
    case 'courier': readCk(); ck.courier = el.dataset.v; delete ckErr.courier; render(); break;
    case 'copy': copyText(el.dataset.v); break;
    case 'saveqr': saveQr(); break;
    case 'sendslip': {
      const [, a] = parse(); const ord = S.orders.find(x => x.code === a);
      if (!ord || ord.status !== 'awaiting_payment' || !slipData) return;
      ord.slip = slipData; ord.slipAt = Date.now(); ord.status = 'pending_review'; slipData = null; save();
      location.hash = '#track-' + ord.code; toast('ສົ່ງບິນແລ້ວ · ຮ້ານຈະກວດ ແລະ ອັບເດດສະຖານະໃນໜ້ານີ້');
      break;
    }
    case 'cancelorder': {
      const [, a] = parse(); const ord = S.orders.find(x => x.code === a);
      if (ord && ord.status === 'awaiting_payment') { ord.status = 'cancelled'; restock(ord); save(); location.hash = '#shop'; toast('ຍົກເລີກອໍເດີ ' + ord.code + ' ແລ້ວ'); }
      break;
    }
    case 'a-filter': af = el.dataset.v; render(); break;
    case 'a-confirm': if (o && o.status === 'pending_review') { o.status = 'preparing'; o.confirmedAt = Date.now(); rejecting = null; save(); render(); toast(o.code + ' ຢືນຢັນແລ້ວ · ລູກຄ້າເຫັນ "ກຳລັງກຽມເຄື່ອງ"'); } break;
    case 'a-reject': rejecting = code; if (location.hash !== '#admin' && location.hash !== '#admin-orders') location.hash = '#admin-orders'; else render(); break;
    case 'a-reject-cancel': rejecting = null; render(); break;
    case 'a-reason': if (o && o.status === 'pending_review') { o.status = 'rejected'; o.reason = el.dataset.v; restock(o); rejecting = null; save(); render(); toast(o.code + ' ປະຕິເສດແລ້ວ · ຄືນ stock'); } break;
    case 'a-ship': { const inp = $('#trk-' + code); const v = inp ? inp.value.trim() : ''; if (!v) { toast('ໃສ່ເລກພັດສະດຸກ່ອນ'); if (inp) inp.focus(); return; } o.status = 'shipped'; o.tracking = v; o.shippedAt = Date.now(); save(); render(); toast(o.code + ' ໝາຍວ່າສົ່ງແລ້ວ'); break; }
    case 'a-done': o.status = 'done'; o.doneAt = Date.now(); save(); render(); break;
    case 'a-cancel': if (o && o.status === 'awaiting_payment') { o.status = 'cancelled'; restock(o); save(); render(); toast(o.code + ' ຍົກເລີກແລ້ວ · ຄືນ stock'); } break;
    case 'a-zoom': zoom = o && o.slip; render(); break;
    case 'zoom-close': zoom = null; render(); break;
    case 'st': { const c = colorOf(P(el.dataset.pid), el.dataset.color); const s = el.dataset.size; c.stock[s] = Math.max(0, (c.stock[s] || 0) + +el.dataset.d); save(); render(); break; }
    case 'a-add-toggle': addOpen = !addOpen; newImg = null; render(); break;
    case 'drop-ask': dropAsk = true; render(); break;
    case 'drop-no': dropAsk = false; render(); break;
    case 'drop-go': {
      const next = String(Number(S.current) + 1).padStart(2, '0'); const m = new Date();
      S.drops.push({ id: next, name: 'DROP ' + next, month: m.toLocaleString('en-US', { month: 'short' }).toUpperCase() + ' ' + m.getFullYear() });
      S.current = next; dropAsk = false; filter = 'all'; save(); render(); toast('ເປີດ DROP ' + next + ' ແລ້ວ · ເພີ່ມສິນຄ້າໃໝ່ໃນແຖບສິນຄ້າ');
      break;
    }
    case 'reset-ask': resetAsk = true; render(); break;
    case 'reset-no': resetAsk = false; render(); break;
    case 'reset-go': S = seed(); save(); resetAsk = false; filter = 'all'; pdp = { id: null }; ck = null; qrDraft = undefined; render(); toast('ກັບໄປຂໍ້ມູນຕົວຢ່າງແລ້ວ'); break;
  }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && zoom) { zoom = null; render(); } else if (e.key === 'Escape' && $('#splash')) enterShop(); });
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'slip') readImage(t.files[0], 900, d => { slipData = d; render(); });
  if (t.id === 'np-img') { const fm = $('#addform'); const keep = fm ? Object.fromEntries(new FormData(fm)) : {}; readImage(t.files[0], 900, d => { newImg = d; render(); const f2 = $('#addform'); if (f2) Object.entries(keep).forEach(([k, v]) => { if (f2.elements[k] && typeof v === 'string') f2.elements[k].value = v; }); }); }
  if (t.id === 'qrfile') readImage(t.files[0], 700, d => { qrDraft = d; render(); });
});
document.addEventListener('submit', e => {
  e.preventDefault();
  const fm = e.target;
  if (fm.id === 'ckform') submitCheckout();
  if (fm.id === 'trackform') { const c = fm.elements.code.value.trim().toUpperCase(); if (c) location.hash = '#track-' + (c.startsWith('PV-') ? c : 'PV-' + c.replace(/^PV/, '')); }
  if (fm.id === 'bankform') { S.bank.bank = fm.elements.bank.value.trim() || 'BCEL'; S.bank.name = fm.elements.name.value.trim(); S.bank.number = fm.elements.number.value.trim(); if (qrDraft !== undefined) S.bank.qr = qrDraft; qrDraft = undefined; save(); render(); toast('ບັນທຶກບັນຊີແລ້ວ'); }
  if (fm.id === 'addform') {
    const g = k => (fm.elements[k] ? fm.elements[k].value.trim() : '');
    const price = parseInt(g('price').replace(/\D/g, ''), 10);
    const stock = {}; ['M', 'L', 'XL', 'FREE'].forEach(s => { const n = parseInt(g('s-' + s), 10); if (n > 0) stock[s] = n; });
    if (!g('name') || !price || !Object.keys(stock).length || !newImg) { toast('ໃສ່ຊື່, ລາຄາ, stock ຢ່າງໜ້ອຍ 1 ໄຊ ແລະ ຮູບ'); return; }
    S.products.unshift({ id: 'p' + Date.now().toString(36), name: g('name'), lao: g('lao'), cat: g('cat'), price, drop: S.current, chart: g('cat') === 'acc' ? null : (g('cat') === 'bottoms' ? 'pant' : 'top'),
      colors: [{ key: 'default', label: 'ສີດຽວ', hex: '#888', imgs: [newImg], stock }] });
    addOpen = false; newImg = null; save(); render(); toast('ເພີ່ມສິນຄ້າແລ້ວ · ເຫັນໃນໜ້າຮ້ານທັນທີ');
  }
});

(function grain() {
  try {
    const c = document.createElement('canvas'); c.width = c.height = 128;
    const g = c.getContext('2d'), d = g.createImageData(128, 128);
    for (let i = 0; i < d.data.length; i += 4) { const v = Math.random() * 255 | 0; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 255; }
    g.putImageData(d, 0, 0);
    const el = document.createElement('div'); el.className = 'grain'; el.setAttribute('aria-hidden', 'true');
    el.style.backgroundImage = `url(${c.toDataURL()})`; document.body.appendChild(el);
  } catch (e) {}
})();
if (parse()[0] === 'shop') showSplash();
route();
})();
</script>
